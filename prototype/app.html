async function downscale(file, max) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bitmap.width * scale);
  c.height = Math.round(bitmap.height * scale);
  c.getContext('2d').drawImage(bitmap, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
  if (!blob) throw new Error('no blob');
  return blob;
}

async function saveBirth() {
  const s = J();
  const err = (msg) => { $('b-error').hidden = false; $('b-error').textContent = msg; };
  const date = $('b-date').value;
  if (!validISO(date)) return err(s.errDate);
  const ga = 280 - daysBetween(date, data.profile.due);
  if (ga < 154 || date > todayISO()) return err(s.errRange);
  const num = (v) => Number(String(v).trim().replace(',', '.'));
  let weight = $('b-weight').value.trim() ? num($('b-weight').value) : null;
  if (weight !== null && weight > 0 && weight < 10) weight *= 1000; // typed in kg
  if (weight !== null && !(weight >= 300 && weight <= 6500)) return err(s.errWeight);
  const length = $('b-length').value.trim() ? num($('b-length').value) : null;
  if (length !== null && !(length >= 20 && length <= 65)) return err(s.errLength);
  const prev = data.birth || {};
  const birth = { date, time: $('b-time').value, name: $('b-name').value.trim().slice(0, 40), sex: ui.birthSex, weight: weight === null ? null : Math.round(weight), length: length === null ? null : Math.round(length * 10) / 10, ga, photo: !!prev.photo };
  if (ui.birthPhoto) {
    await photoPut('birth', ui.birthPhoto);
    birth.photo = true;
  }
  const first = journey() !== 'born';
  data.birth = birth;
  data.status = 'born';
  data.loss = null;
  if (birth.sex !== 'unknown') data.profile.sex = birth.sex;
  data.activeKicks = null;
  data.activeContraction = null;
  ui.chat = [];
  save();
  closeSheet();
  if (ui.lunaView === 'full') closeLunaFull();
  postLuna({ sex: data.profile.sex });
  renderAll();
  showTab('today');
  if (first) openBirthCard(true);
}

/* ---------- The birth card (a canvas image to keep or share) ---------- */
function fitText(g, text, font, size, maxWidth) {
  let px = size;
  g.font = `${font.replace('{px}', px)}`;
  while (g.measureText(text).width > maxWidth && px > 24) {
    px -= 2;
    g.font = `${font.replace('{px}', px)}`;
  }
}

async function drawBirthCard() {
  const b = data.birth;
  const s = J();
  const W = 1080;
  const H = 1350;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const g = c.getContext('2d');
  try { await document.fonts.load('600 64px Lora'); await document.fonts.load('600 32px "Sofia Sans"'); } catch (err) { /* fallback fonts */ }
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#16152B');
  bg.addColorStop(1, '#2C2956');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#FFE6A3';
  for (let i = 0; i < 110; i++) {
    g.globalAlpha = 0.2 + rnd() * 0.6;
    g.beginPath();
    g.arc(rnd() * W, rnd() * H * 0.62, 1 + rnd() * 2.4, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  const cx = W / 2;
  const cy = 400;
  const r = 230;
  const blob = b.photo ? await photoGet('birth') : null;
  if (blob) {
    const bmp = await createImageBitmap(blob);
    g.save();
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.clip();
    const sc = Math.max((2 * r) / bmp.width, (2 * r) / bmp.height);
    g.drawImage(bmp, cx - (bmp.width * sc) / 2, cy - (bmp.height * sc) / 2, bmp.width * sc, bmp.height * sc);
    g.restore();
    g.lineWidth = 8;
    g.strokeStyle = '#F6C8B5';
    g.beginPath();
    g.arc(cx, cy, r + 8, 0, Math.PI * 2);
    g.stroke();
  } else {
    // the Lunabump crescent with its little star
    const m = document.createElement('canvas');
    m.width = m.height = 2 * r;
    const mg = m.getContext('2d');
    mg.fillStyle = '#F6C8B5';
    mg.beginPath();
    mg.arc(r, r, r, 0, Math.PI * 2);
    mg.fill();
    mg.globalCompositeOperation = 'destination-out';
    mg.beginPath();
    mg.arc(r * 1.55, r * 0.62, r * 0.82, 0, Math.PI * 2);
    mg.fill();
    g.drawImage(m, cx - r, cy - r);
    g.fillStyle = '#FFE6A3';
    g.beginPath();
    g.arc(cx + r * 0.32, cy + r * 0.3, r * 0.15, 0, Math.PI * 2);
    g.fill();
  }
  g.textAlign = 'center';
  g.fillStyle = '#F3F0FF';
  const title = s.welcome(b.name, b.sex);
  fitText(g, title, '600 {px}px Lora, Georgia, serif', 76, W - 140);
  g.fillText(title, cx, 760);
  g.fillStyle = '#B5AFD3';
  g.font = '500 34px "Sofia Sans", system-ui, sans-serif';
  g.fillText(s.bornOn(fmtDate(b.date), b.time), cx, 826);
  const stats = [
    b.weight ? [s.grams(b.weight), s.statWeight] : null,
    b.length ? [s.cm(b.length), s.statLength] : null,
    Number.isFinite(b.ga) ? [`${Math.floor(b.ga / 7)}+${b.ga % 7}`, s.statWeeks] : null,
  ].filter(Boolean);
  const boxW = 280;
  const gap = 24;
  const x0 = cx - (stats.length * boxW + (stats.length - 1) * gap) / 2;
  stats.forEach(([v, k], i) => {
    const x = x0 + i * (boxW + gap);
    g.fillStyle = 'rgba(243, 240, 255, 0.08)';
    g.beginPath();
    if (g.roundRect) g.roundRect(x, 900, boxW, 170, 28); else g.rect(x, 900, boxW, 170);
    g.fill();
    g.fillStyle = '#F3F0FF';
    g.font = '600 52px Lora, Georgia, serif';
    g.fillText(v, x + boxW / 2, 985);
    g.fillStyle = '#B5AFD3';
    g.font = '700 26px "Sofia Sans", system-ui, sans-serif';
    g.fillText(k.toUpperCase(), x + boxW / 2, 1035);
  });
  g.fillStyle = '#F6C8B5';
  g.font = '600 34px Lora, Georgia, serif';
  g.fillText('Lunabump', cx, 1260);
  return new Promise((res) => c.toBlob(res, 'image/png'));
}

}

function closeSheet() {

function callRow(label, number, hint) {

/* ---------- Luna (prepared answers, triage first) ---------- */
function suggestions() {
  const tri = triOf(weekNow());
  const ids = [['nausea', 'vitamins', 'caffeine', 'food'], ['movements', 'glucose', 'exercise', 'food'], ['sleep', 'labour', 'movements', 'heartburn']][tri];
  if (isPartner()) return [tri < 2 ? 'support' : 'birthpartner', ...ids.slice(0, 3)].map((id) => topicById[id]);
  return ids.map((id) => topicById[id]);
}

function lunaMessageHTML(msg) {
  if (msg.from === 'me') return `<div class="msg msg-me">${esc(msg.text)}</div>`;
  const parts = [];
  for (const f of msg.flags || []) {
    parts.push(`<div class="notice notice-alert"><strong>${esc(STR[msg.lang].levelTitle[f.level])}</strong><span>${esc(STR[msg.lang].levelText[f.level])}</span><button type="button" class="link-btn" data-action="flag" data-flag="${f.id}">${esc(STR[msg.lang].whatToDo)}</button></div>`);
  }
  if (msg.topic) {
    const tp = topicById[msg.topic];
    for (const p of tp.a[msg.lang]) parts.push(`<p>${esc(p)}</p>`);
    parts.push(sourceLine(tp.src, msg.lang));
  } else if (msg.text) {
    parts.push(`<p>${esc(msg.text)}</p>`);
  }
  return `<div class="msg msg-luna">${parts.join('')}</div>`;
}

function renderLuna() {
  const w = weekNow();
  $('sheet-body').innerHTML = `<p class="fine">${esc(t().lunaProto)}</p><div class="chat" id="chat" aria-live="polite">${ui.chat.map(lunaMessageHTML).join('')}</div>`;
  $('sheet-foot').hidden = false;
  $('sheet-foot').innerHTML = `
    <div class="suggest" role="group" aria-label="${esc(t().suggestLabel)}">${suggestions().map((tp) => `<button type="button" class="chip" data-action="luna-ask" data-topic="${tp.id}">${esc(L(tp.q))}</button>`).join('')}</div>
    <form class="ask" id="ask-form"><label class="visually-hidden" for="ask-input">${esc(t().askLabel)}</label><input class="input" id="ask-input" autocomplete="off" placeholder="${esc(t().askPh(w))}"><button type="submit" class="btn" aria-label="${esc(t().send)}">${ICON.send}</button></form>`;
  $('ask-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('ask-input').value.trim();
    if (!text) return;
    askLuna(text);
  });
  const body = $('sheet-body');
  body.scrollTop = body.scrollHeight;
}

function openLuna(topicId) {
  if (!data.profile) return;
  if (journey() !== 'pregnant') return;
  if (!ui.chat.length) ui.chat.push({ from: 'luna', lang, text: isPartner() ? J().lunaHelloPartner(data.profile.name, weekNow()) : t().lunaHello(data.profile.name, weekNow()) });
  openSheet('luna', { html: `<div class="luna-head"><span class="luna-badge">${ICON.moon}</span><div><h2 id="sheet-title">${esc(t().lunaTitle)}</h2><p class="fine">${esc(t().lunaSub)}</p></div></div>` }, '');
  renderLuna();
  if (topicId) askLuna(L(topicById[topicId].q), topicId);
}

function askLuna(text, topicId) {
  const qLang = /[а-яё]/i.test(text) ? 'bg' : topicId ? lang : 'en';
  const low = ` ${text.toLowerCase()} `;
  const w = weekNow();
  ui.chat.push({ from: 'me', text });
  const flags = topicId ? [] : RED.filter((f) => f.match(low, w)).sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]).slice(0, 2);
  let topic = topicId;
  if (!topic) {
    let best = 0;
    for (const tp of TOPICS) {
      const score = tp.kw.filter((k) => low.includes(k)).length;
      if (score > best) { best = score; topic = tp.id; }
    }
  }
  if (topic) ui.chat.push({ from: 'luna', lang: qLang, flags, topic });
  else ui.chat.push({ from: 'luna', lang: qLang, flags, text: flags.length ? STR[qLang].lunaTriageOnly : STR[qLang].lunaUnknown });
  renderLuna();
  const input = $('ask-input');
  if (input) input.value = '';
}

function openExport() {
  const json = JSON.stringify(data, null, 2);
  openSheet('export', t().dataTitle, `<p class="fine">${esc(t().storedWhere)}</p><textarea class="input" id="export-text" readonly style="min-height:50vh;font:13px/1.4 ui-monospace,Menlo,monospace">${esc(json)}</textarea>`,
    `<button type="button" class="btn btn-block" data-action="copy-export">${ICON.copy}<span>${esc(t().copy)}</span></button>`);
}

async function copyText(text, selectEl) {
  try {
    await navigator.clipboard.writeText(text);
    toast(t().copied);
  } catch (err) {
    if (selectEl) { selectEl.focus(); selectEl.select(); }
    toast(t().copyFailed);
  }
}

  ui.ob = { step: 'welcome', stage: 'pregnant', method: 'due', ivfDay: 5, date: '', name: '', partnerName: '', sex: 'unknown', code: '', codeMsg: '', mode: 'dreamy', consents: { device: false, luna: false, stats: false } };
  $('onboarding').hidden = false;
  tweenFrom = 150;
  showTab('today');
  renderOnboarding();
  setLunaView('stage');
  postLuna({ mode: 'moon', days: 150 });
}

function obDue() {
  const o = ui.ob;
  if (!validISO(o.date)) return null;
  if (o.method === 'due') return o.date;
  if (o.method === 'lmp') return addDays(o.date, 280);
  return addDays(o.date, o.ivfDay === 3 ? 263 : 261);
}

function obGa() {
  const due = obDue();
  return due ? 280 - daysBetween(todayISO(), due) : null;
}

function obBounds() {
  const today = todayISO();
  const o = ui.ob;
  const offset = o.method === 'due' ? 0 : o.method === 'lmp' ? -280 : o.ivfDay === 3 ? -263 : -261;
  return { min: addDays(today, -14 + offset), max: addDays(today, 252 + offset) };
}

function renderOnboarding() {
  const o = ui.ob;
  const s = t().ob;
  const i = OB_STEPS.indexOf(o.step);
  const dots = i >= 0 ? `<div class="ob-dots" role="img" aria-label="${esc(s.step(i + 1, OB_STEPS.length))}">${OB_STEPS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>` : '<span></span>';
  const langSwitch = `<div class="seg" role="group" aria-label="${esc(t().language)}" style="flex:none"><button type="button" data-action="lang" data-lang="en" aria-pressed="${lang === 'en'}" lang="en">EN</button><button type="button" data-action="lang" data-lang="bg" aria-pressed="${lang === 'bg'}" lang="bg">BG</button></div>`;
  let body = '';
  if (o.step === 'welcome') {
    body = `<div class="ob-top"><span class="ob-brand">${ICON.moon}Lunabump</span>${langSwitch}</div>
      <h1 id="ob-title">${esc(s.welcomeTitle)}</h1>
      <p class="muted">${esc(s.welcomeText)}</p>
      <div class="ob-actions"><button type="button" class="btn btn-block" data-action="ob-start">${esc(s.start)}</button><button type="button" class="btn btn-quiet btn-block" data-action="ob-demo">${esc(s.demo)}</button><button type="button" class="link-btn small" style="justify-self:center" data-action="ob-demo-partner">${esc(J().partnerDemo)}</button></div>
      <p class="fine">${esc(t().disclaimer)}</p>`;
  } else if (o.step === 'stage') {
    body = `<div class="ob-top">${dots}${langSwitch}</div>
      <h1 id="ob-title">${esc(s.stageTitle)}</h1>
      <div class="ob-options">${['pregnant', 'partner', 'ttc'].map((k) => `<button type="button" class="ob-option" data-action="ob-stage" data-stage="${k}">${esc(s.stages[k])}</button>`).join('')}</div>
      <button type="button" class="btn btn-line" data-action="ob-back" data-to="welcome">${esc(s.back)}</button>`;
  } else if (o.step === 'ttc') {
    body = `<h1 id="ob-title">${esc(s.ttcTitle)}</h1><p class="muted">${esc(s.ttcText)}</p>
      <button type="button" class="btn btn-line" data-action="ob-back" data-to="stage">${esc(s.back)}</button>`;
  } else if (o.step === 'date') {
    const ga = obGa();
    const ok = ga !== null && ga >= 28 && ga <= 294;
    const b = obBounds();
    const result = ga === null ? '' : ok
      ? `<p class="ob-result" role="status">${esc(s.result(Math.floor(ga / 7), ga % 7, fmtDate(obDue())))}</p>`
      : `<p class="ob-error" role="alert">${esc(s.outOfRange(Math.floor(ga / 7)))}</p>`;
    const partner = o.stage === 'partner';
    const codeBlock = partner ? `<div class="field"><label class="small" style="font-weight:600" for="ob-code">${esc(J().obCodeTitle)}</label>
        <div class="ask"><input class="input" id="ob-code" value="${esc(o.code)}" placeholder="${esc(J().obCodePh)}" autocomplete="off" autocapitalize="characters"><button type="button" class="btn" data-action="ob-code">${esc(J().useCode)}</button></div>
        <div id="ob-code-msg">${o.codeMsg}</div></div>
      <p class="fine">${esc(J().obOr)}</p>` : '';
    body = `<div class="ob-top">${dots}${langSwitch}</div>
      <h1 id="ob-title">${esc(s.dateTitle)}</h1>
      ${codeBlock}
      <div class="seg" role="radiogroup" aria-label="${esc(s.dateTitle)}">${['due', 'lmp', 'ivf'].map((m) => `<button type="button" role="radio" aria-checked="${o.method === m}" data-action="ob-method" data-method="${m}">${esc(s.methods[m])}</button>`).join('')}</div>
      ${o.method === 'ivf' ? `<div class="field"><span class="small" style="font-weight:600">${esc(s.ivfDay)}</span><div class="seg" role="radiogroup" aria-label="${esc(s.ivfDay)}">${[3, 5].map((d) => `<button type="button" role="radio" aria-checked="${o.ivfDay === d}" data-action="ob-ivfday" data-day="${d}">${esc(s.ivfDays[d])}</button>`).join('')}</div></div>` : ''}
      <label class="field"><span>${esc(partner && o.method === 'lmp' ? J().lmpPartner : s.dateLabel[o.method])}</span><input class="input" type="date" id="ob-date" value="${esc(o.date)}" min="${b.min}" max="${b.max}"></label>
      <div id="ob-date-result">${result}</div>
      <p class="fine">${esc(s.dateHint)}</p>
      <div class="row"><button type="button" class="btn btn-line" data-action="ob-back" data-to="stage">${esc(s.back)}</button><button type="button" class="btn" style="flex:1" data-action="ob-next" data-to="name" id="ob-date-next" ${ok ? '' : 'disabled'}>${esc(s.next)}</button></div>`;
  } else if (o.step === 'name') {
    body = `<div class="ob-top">${dots}${langSwitch}</div>
      <h1 id="ob-title">${esc(s.nameTitle)}</h1>
      <input class="input" id="ob-name" value="${esc(o.name)}" placeholder="${esc(s.namePh)}" autocomplete="given-name" aria-labelledby="ob-title">
      ${o.stage === 'partner' ? `<label class="field"><span>${esc(J().partnerNameLabel)}</span><input class="input" id="ob-pname" value="${esc(o.partnerName)}" placeholder="${esc(J().partnerNamePh)}" autocomplete="off"></label>` : ''}
      <h2 style="font:600 19px/1.25 var(--display)">${esc(o.stage === 'partner' ? J().obModeTitlePartner : s.modeTitle)}</h2>
      <div class="mode-cards" role="radiogroup" aria-label="${esc(o.stage === 'partner' ? J().obModeTitlePartner : s.modeTitle)}">${modeCards(o.mode, 'ob-mode')}</div>
      <p class="fine">${esc(s.modeHint)}</p>
      <div class="row"><button type="button" class="btn btn-line" data-action="ob-back" data-to="date">${esc(s.back)}</button><button type="button" class="btn" style="flex:1" data-action="ob-next" data-to="privacy">${esc(s.next)}</button></div>`;
  } else if (o.step === 'privacy') {
    body = `<div class="ob-top">${dots}${langSwitch}</div>
      <h1 id="ob-title">${esc(s.privacyTitle)}</h1>
      <p class="muted">${esc(s.privacyText)}</p>
      <div>${['device', 'luna', 'stats'].map((k) => `<div class="switch-row"><label for="ob-consent-${k}">${esc(t().consent[k][0])}<small>${esc(t().consent[k][1])}</small></label><span class="switch"><input type="checkbox" role="switch" id="ob-consent-${k}" data-ob-consent="${k}" ${o.consents[k] ? 'checked' : ''}><span></span></span></div>`).join('')}</div>
      <div class="row"><button type="button" class="btn btn-line" data-action="ob-back" data-to="name">${esc(s.back)}</button><button type="button" class="btn" style="flex:1" data-action="ob-finish">${esc(o.mode === 'moon' ? s.finishMoon : s.finish)}</button></div>`;
  }
  $('ob-card').innerHTML = body;
  $('ob-card').hidden = o.step === 'reveal';
  if (ui.lunaView === 'stage') postLuna({ inset: { top: 0, bottom: o.step === 'reveal' ? 0 : $('ob-card').offsetHeight } });
  const focusable = $('ob-card').querySelector('h1');
  if (focusable) { focusable.tabIndex = -1; focusable.focus({ preventScroll: true }); }
}

// the moon waxes smoothly to the chosen week
let tweenRaf = 0;
let tweenFrom = 150;
function tweenDays(target) {
  cancelAnimationFrame(tweenRaf);
  const from = tweenFrom;
  const to = Math.min(280, Math.max(56, target));
  if (reduceMotion.matches) { tweenFrom = to; postLuna({ days: to }); return; }
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 900);
    const e = 1 - Math.pow(1 - k, 3);
    tweenFrom = Math.round(from + (to - from) * e);
    postLuna({ days: tweenFrom });
    if (k < 1) tweenRaf = requestAnimationFrame(step);
  };
  tweenRaf = requestAnimationFrame(step);
}

function finishOnboarding(profile, withExamples) {
  data = blank();
  data.profile = profile;
  if (withExamples) seedExamples(profile.stage === 'partner');
  save();
  ui.chat = [];
  ui.ob.step = 'reveal';
  renderOnboarding();
  renderAll();
  // Reveal: the moon, a warm flash, then the baby on today's date
  const s = t().ob;
  const ga = gaDays();
  $('reveal-title').textContent = profile.mode === 'moon' ? s.revealMoon : s.revealTitle;
  $('reveal-sub').textContent = t().weekDay(Math.floor(ga / 7), ga % 7);
  $('reveal').hidden = false;
  $('reveal-skip').hidden = false;
  $('reveal-skip').textContent = s.skip;
  tweenDays(lunaDays());
  const quick = reduceMotion.matches;
  revealTimers.push(setTimeout(() => {
    if (profile.mode !== 'moon') $('luna-flash').classList.add('on');
  }, quick ? 0 : 900));
  revealTimers.push(setTimeout(() => {
    postLuna({ ...lunaSettings() });
    $('luna-flash').classList.remove('on');
  }, quick ? 50 : 1450));
  revealTimers.push(setTimeout(endReveal, quick ? 1200 : 4200));
}

let revealTimers = [];
function endReveal() {
  revealTimers.forEach(clearTimeout);
  revealTimers = [];
  if (!ui.ob) return;
  postLuna({ ...lunaSettings() });
  $('luna-flash').classList.remove('on');
  $('reveal').hidden = true;
  $('reveal-skip').hidden = true;
  $('onboarding').hidden = true;
  ui.ob = null;
  setLunaView('hero');
  showTab('today');
  $('greeting').tabIndex = -1;
  $('greeting').focus({ preventScroll: true });
}

function seedExamples(partner) {
  const today = todayISO();
  const moods = [4, 3, 4, 5, 3, 2, 4, 4, 5, 3, 4, 4, 3, 5];
  moods.forEach((v, i) => { data.moods[addDays(today, -(i + 1))] = { v, example: true }; });
  if (partner) {
    data.appointments.push({ id: uid(), kind: 'glucose', title: '', date: addDays(today, 5), time: '08:30', place: lang === 'bg' ? 'Женска консултация' : 'Antenatal clinic', note: '', example: true });
    data.checklist.p_scan = true;
    return;
  }
  data.symptoms.push(
    { id: uid(), at: at(addDays(today, -1), 21, 10), items: ['backpain'], level: 3, note: lang === 'bg' ? 'По-добре след разходка' : 'Better after a walk', example: true },
    { id: uid(), at: at(addDays(today, -3), 8, 40), items: ['heartburn', 'sleep'], level: 2, note: '', example: true },
    { id: uid(), at: at(addDays(today, -6), 19, 5), items: ['cramps'], level: 4, note: '', example: true },
  );
  data.weightSetup = { height: 166, pre: 62, example: true };
  for (const [w, kg] of [[12, 62.8], [16, 64.1], [20, 65.9], [23, 67.4]]) {
    data.weights.push({ id: uid(), date: addDays(data.profile.due, w * 7 - 280), kg, example: true });
  }
  data.appointments.push({ id: uid(), kind: 'glucose', title: '', date: addDays(today, 5), time: '08:30', place: lang === 'bg' ? 'Женска консултация' : 'Antenatal clinic', note: '', example: true });
  const sessions = [[-1, 21, 5, 18, 10], [-2, 20, 40, 24, 10], [-3, 9, 15, 31, 8], [-4, 22, 0, 16, 10], [-5, 13, 30, 27, 9]];
  for (const [d, h, m, len, n] of sessions) {
    const start = at(addDays(today, d), h, m);
    data.kickSessions.push({ start, end: start + len * 60000, count: n, example: true });
  }
}

/* =========================================================================
   Navigation and actions
   ========================================================================= */

function showTab(tab) {
  ui.tab = tab;
  ui.tool = null;
  $('screen-tool').hidden = true;
  for (const name of ['today', 'tools', 'explore', 'me']) $(`screen-${name}`).hidden = name !== tab;
  for (const btn of document.querySelectorAll('.tab[data-tab]')) {
    if (btn.dataset.tab === tab) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  }
  if (tab === 'tools') renderTools();
  if (tab === 'explore') renderExplore();
  if (tab === 'me') renderMe();
  window.scrollTo(0, 0);
  updateLunaRunning();
}

function renderAll() {
  applyJourney();
  renderStatic();
  renderToday();
  if (ui.tool) renderTool();
  else if (ui.tab === 'tools') renderTools();
  if (ui.tab === 'explore') renderExplore();
  if (ui.tab === 'me') renderMe();
}

let toastTimer = 0;
function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.remove('fade');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('fade'), 2400);
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* ignore */ }
  renderAll();
  if (ui.ob) renderOnboarding();
  if (sheetKind === 'luna') { $('sheet-headline').querySelector('#sheet-title').textContent = t().lunaTitle; renderLuna(); }
  else if (sheetKind) closeSheet();
  postLuna({ lang });
}

    openTool(go === 'symptom' ? 'symptoms' : go);
  },
  article: (el) => openArticle(el.dataset.topic),
  urgent: () => openUrgent(),
  flag: (el) => openFlag(el.dataset.flag),
  'sheet-close': () => closeSheet(),
  'sym-chip': (el) => {
    const id = el.dataset.sym;
    if (ui.symPicked.has(id)) ui.symPicked.delete(id); else ui.symPicked.add(id);

  },

    if (!ui.symPicked.size) { ui.symNotice = esc(t().pickSymptom); keepNote(renderSymptoms); return; }
    const items = [...ui.symPicked];
    const level = ui.symLevel;
    data.symptoms.push({ id: uid(), at: Date.now(), items, level, note: ($('sym-note').value || '').trim().slice(0, 500) });
    save();
    const hints = [];
    if (items.includes('headache') && level >= 4) hints.push(t().headacheHint);
    if (items.includes('swelling') && level >= 4) hints.push(t().swellingHint);
    ui.symNotice = hints.length ? `${hints.map(esc).join(' ')} <button type="button" class="link-btn" data-action="flag" data-flag="preeclampsia">${esc(t().whatToDo)}</button>` : '';
    ui.symPicked.clear();
    ui.symLevel = 3;
    renderSymptoms();
    toast(t().saved);
  },
  'cal-prev': (el) => { shiftMonth(el.dataset.cal, -1); renderTool(); },
  'cal-next': (el) => { shiftMonth(el.dataset.cal, 1); renderTool(); },
  'cal-day': (el) => { ui.calPick[el.dataset.cal] = ui.calPick[el.dataset.cal] === el.dataset.day ? null : el.dataset.day; renderTool(); },
  'kick-tap': (el) => {
    if (!data.activeKicks) data.activeKicks = { start: Date.now(), count: 0 };
    data.activeKicks.count += 1;
    save();
    try { navigator.vibrate && navigator.vibrate(20); } catch (err) { /* not supported */ }
    if (!$('kick-timer')) renderKicks(); else $('kick-count').textContent = data.activeKicks.count;
    sparkAt($('kick-tap'));
    postLuna({ kicks: kicksToday() });
  },
  'kick-finish': () => {
    const a = data.activeKicks;
    if (a && a.count) data.kickSessions.push({ start: a.start, end: Date.now(), count: a.count });
    data.activeKicks = null;
    save();
    renderKicks();
    if (a && a.count) toast(t().kickSession(a.count, Math.max(1, Math.round((Date.now() - a.start) / 60000))));
  },
  'kick-cancel': () => { data.activeKicks = null; save(); renderKicks(); postLuna({ kicks: kicksToday() }); },
  'con-toggle': () => {
    if (data.activeContraction) {
      data.contractions.push({ start: data.activeContraction, end: Date.now() });
      data.activeContraction = null;
    } else {
      data.activeContraction = Date.now();
    }
    try { navigator.vibrate && navigator.vibrate(30); } catch (err) { /* not supported */ }
    save();
    renderContractions();
  },
  'con-sample': () => {
    const now = Date.now();
    for (let i = 12; i >= 1; i--) {
      const start = now - i * 285000 + Math.round((Math.random() - 0.5) * 30000);
      data.contractions.push({ start, end: start + 50000 + Math.round(Math.random() * 20000), example: true });
    }
    save();
    renderContractions();
  },
  'con-clear': () => { data.contractions = []; data.activeContraction = null; save(); renderContractions(); toast(t().conCleared); },
  'luna-ask': (el) => { if (sheetKind === 'luna') askLuna(L(topicById[el.dataset.topic].q), el.dataset.topic); else openLuna(el.dataset.topic); },
  lang: (el) => setLang(el.dataset.lang),
  tool: (el) => { closeSheet(); openTool(el.dataset.tool); },

  },
  sex: (el) => { data.profile.sex = el.dataset.sex; save(); renderMe(); postLuna({ sex: data.profile.sex }); },
  mode: (el) => { data.profile.mode = el.dataset.mode; save(); renderMe(); postLuna({ mode: data.profile.mode }); },
  'profile-edit': () => { ui.editingProfile = true; renderMe(); $('edit-name').focus(); },
  'profile-cancel': () => { ui.editingProfile = false; renderMe(); },
  'profile-save': () => {
    const due = $('edit-due') ? $('edit-due').value : data.profile.due;
    const ga = validISO(due) ? 280 - daysBetween(todayISO(), due) : null;
    if ($('edit-due') && (ga === null || ga < 28 || ga > 294)) {
      $('edit-error').hidden = false;
      $('edit-error').textContent = t().ob.outOfRange(ga === null ? 0 : Math.floor(ga / 7));
      return;
    }
    data.profile.name = $('edit-name').value.trim().slice(0, 40);
    if ($('edit-pname')) data.profile.partnerName = $('edit-pname').value.trim().slice(0, 40);
    data.profile.due = due;
    ui.editingProfile = false;
    save();
    renderAll();
    postLuna({ days: lunaDays() });
    toast(t().saved);
  },
  export: () => openExport(),
  'copy-export': () => copyText(JSON.stringify(data, null, 2), $('export-text')),
  copy: (el) => copyText(el.dataset.copy),
  'examples-clear': () => {
    for (const [k, m] of Object.entries(data.moods)) if (m.example) delete data.moods[k];
    data.symptoms = data.symptoms.filter((e) => !e.example);
    data.kickSessions = data.kickSessions.filter((e) => !e.example);
    data.contractions = data.contractions.filter((e) => !e.example);
    data.weights = data.weights.filter((e) => !e.example);
    data.appointments = data.appointments.filter((e) => !e.example);
    if (data.weightSetup && data.weightSetup.example) data.weightSetup = null;
    save();
    renderMe();
    toast(t().examplesCleared);
  },
  'delete-ask': () => { ui.confirmDelete = true; renderMe(); },
  'delete-cancel': () => { ui.confirmDelete = false; renderMe(); },
  'delete-confirm': () => {
    ui.confirmDelete = false;
    data = blank();
    forgetStored();
    photoClearAll();
    ui.chat = [];
    toast(t().deleted);
    startOnboarding();
  },
  'ob-start': () => { ui.ob.step = 'stage'; renderOnboarding(); },
  'ob-demo': () => {
    const due = addDays(todayISO(), 109);
    finishOnboarding({ stage: 'pregnant', name: t().ob.demoName, due, method: 'due', mode: 'dreamy', sex: 'unknown', consents: { device: true, luna: false, stats: false } }, true);
  },
  'ob-demo-partner': () => {
    const due = addDays(todayISO(), 109);
    finishOnboarding({ stage: 'partner', name: J().demoPartner, partnerName: J().demoHer, due, method: 'due', mode: 'dreamy', sex: 'unknown', consents: { device: true, luna: false, stats: false } }, true);
  },
  'ob-code': () => {
    const res = readCode($('ob-code').value);
    const o = ui.ob;
    if (!res) {
      o.code = $('ob-code').value;
      o.codeMsg = `<p class="ob-error" role="alert">${esc(J().codeBad)}</p>`;
      renderOnboarding();
      return;
    }
    Object.assign(o, { code: res.code, method: 'due', date: res.due, sex: res.sex, codeMsg: `<p class="ob-result" role="status">${esc(J().codeOk(fmtDate(res.due)))}</p>` });
    renderOnboarding();
    tweenDays(obGa());
  },
  'ob-stage': (el) => {
    ui.ob.stage = el.dataset.stage;
    ui.ob.step = el.dataset.stage === 'ttc' ? 'ttc' : 'date';
    renderOnboarding();
  },
  'ob-back': (el) => { ui.ob.step = el.dataset.to; renderOnboarding(); },
  'ob-next': (el) => {
    if (ui.ob.step === 'name') {
      ui.ob.name = $('ob-name').value.trim().slice(0, 40);
      if ($('ob-pname')) ui.ob.partnerName = $('ob-pname').value.trim().slice(0, 40);
    }
    ui.ob.step = el.dataset.to;
    renderOnboarding();
  },
  'ob-method': (el) => { ui.ob.method = el.dataset.method; ui.ob.date = ''; ui.ob.codeMsg = ''; renderOnboarding(); },
  'ob-ivfday': (el) => { ui.ob.ivfDay = Number(el.dataset.day); renderOnboarding(); const ga = obGa(); if (ga !== null) tweenDays(ga); },
  'ob-mode': (el) => {
    ui.ob.name = $('ob-name') ? $('ob-name').value.trim().slice(0, 40) : ui.ob.name;
    if ($('ob-pname')) ui.ob.partnerName = $('ob-pname').value.trim().slice(0, 40);
    ui.ob.mode = el.dataset.mode;
    renderOnboarding();
  },
  'ob-finish': () => {
    const o = ui.ob;
    finishOnboarding({ stage: o.stage, name: o.name, partnerName: o.stage === 'partner' ? o.partnerName : '', due: obDue(), method: o.method, mode: o.mode, sex: o.sex || 'unknown', consents: { ...o.consents } }, false);
  },
  'reveal-skip': () => endReveal(),

  // journey: the birth, a loss, partner mode
  'birth-open': () => openBirthFlow(),
  'b-sex': (el) => {
    ui.birthSex = el.dataset.sex;
    for (const b of $('b-sex').querySelectorAll('button')) b.setAttribute('aria-checked', String(b === el));
  },
  'birth-save': () => saveBirth(),
  'birth-card': () => openBirthCard(false),
  'card-share': () => shareCard(),
  replay: () => replayPregnancy(),
  'journey-open': () => openJourney(),
  'loss-open': () => openLossFlow(),
  'loss-next': () => renderLossStep(2),
  'loss-back': () => { readLossForm(); renderLossStep(1); },
  'loss-kind': (el) => {
    ui.lossForm.kind = el.dataset.kind;
    for (const b of el.parentElement.querySelectorAll('button')) {
      b.setAttribute('aria-checked', String(b === el));
      b.setAttribute('aria-pressed', String(b === el));
    }
  },
  'loss-save': () => applyLoss(),
  memories: () => openMemories(),
  'mem-del-ask': (el) => {
    const key = el.dataset.key;
    $(`mem-del-${key}`).innerHTML = `<div class="notice notice-alert"><strong>${esc(J().memDeleteConfirm)}</strong><div class="row"><button type="button" class="btn btn-alert" data-action="mem-del-yes" data-key="${esc(key)}">${esc(J().memDelete)}</button><button type="button" class="btn btn-line" data-action="memories">${esc(t().cancel)}</button></div></div>`;
  },
  'mem-del-yes': (el) => deleteMemory(el.dataset.key),
  'new-preg': () => openNewPregnancy(),
  'new-preg-save': () => startNewPregnancy(),
  'journey-undo-ask': () => { ui.confirmUndo = true; renderMe(); },
  'journey-undo-cancel': () => { ui.confirmUndo = false; renderMe(); },
  'journey-undo': () => {
    ui.confirmUndo = false;
    data.status = 'pregnant';
    data.birth = null;
    data.loss = null;
    save();
    renderAll();
    postLuna({ ...lunaSettings() });
    toast(t().saved);
  },
  'invite-copy': () => copyText(J().inviteMessage(makeCode(data.profile.due, data.profile.sex))),
  'invite-share': async () => {
    try { await navigator.share({ text: J().inviteMessage(makeCode(data.profile.due, data.profile.sex)) }); } catch (err) { /* cancelled or blocked */ }
  },
  'me-code': () => {
    const res = readCode($('me-code').value);
    if (!res) { $('me-code-msg').textContent = J().codeBad; return; }
    data.profile.due = res.due;
    if (res.sex !== 'unknown') data.profile.sex = res.sex;
    save();
    renderAll();
    postLuna({ ...lunaSettings() });
    $('me-code-msg').textContent = J().codeOk(fmtDate(res.due));
  },
};

// keep a half-written symptom note when the panel re-renders
function keepNote(render) {
  const note = $('sym-note') ? $('sym-note').value : '';
  render();
  if ($('sym-note')) $('sym-note').value = note;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});

document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.memNote) {
    const key = e.target.dataset.memNote;
    const note = e.target.value.slice(0, 1000);
    if (key === 'current') { if (data.loss) data.loss.note = note; } else if (data.memories[Number(key)]) data.memories[Number(key)].note = note;
    save();
  } else if (e.target.dataset && e.target.dataset.planText) {
    data.plan[e.target.dataset.planText] = e.target.value;
    save();
  } else if (e.target.id === 'calc-date') {
    ui.calc.date = e.target.value;
    const pos = e.target.value;
    renderDueCalc();
    $('calc-date').value = pos;
  } else if (e.target.id === 'sym-level') {
    ui.symLevel = Number(e.target.value);
    const label = t().levels[ui.symLevel - 1];
    $('sym-level-value').textContent = label;
    e.target.setAttribute('aria-valuetext', label);
  } else if (e.target.id === 'ob-date') {
    ui.ob.date = e.target.value;
    const ga = obGa();
    const ok = ga !== null && ga >= 28 && ga <= 294;
    const s = t().ob;
    $('ob-date-result').innerHTML = ga === null ? '' : ok
      ? `<p class="ob-result" role="status">${esc(s.result(Math.floor(ga / 7), ga % 7, fmtDate(obDue())))}</p>`
      : `<p class="ob-error" role="alert">${esc(s.outOfRange(Math.floor(ga / 7)))}</p>`;
    $('ob-date-next').disabled = !ok;
    if (ok) tweenDays(ga);
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.todo) {
    data.checklist[el.dataset.todo] = el.checked;
    save();
  } else if (el.dataset.check) {
    data[el.dataset.check].checked[el.dataset.item] = el.checked;
    save();
    const span = el.nextElementSibling;
    if (span) span.classList.toggle('done', el.checked);
    if (el.dataset.check === 'bag') {
      const y = window.scrollY;
      renderBag();
      window.scrollTo(0, y);
    }
  } else if (el.dataset.qDone) {
    const q = data.questions.find((x) => x.id === el.dataset.qDone);
    if (q) q.done = el.checked;
    save();
    if (el.nextElementSibling) el.nextElementSibling.classList.toggle('done', el.checked);
  } else if (el.id === 'bump-file' && el.files && el.files[0]) {
    addBumpPhoto(el.files[0]);
  } else if (el.id === 'b-photo' && el.files && el.files[0]) {
    downscale(el.files[0], 1080).then((blob) => {
      ui.birthPhoto = blob;
      $('b-photo-state').textContent = J().photoAdded;
    }).catch(() => toast(T().photoFailed));
  } else if (el.dataset.nbCheck) {
    data.newborn.checked[el.dataset.nbCheck] = el.checked;
    save();
    const title = el.nextElementSibling && el.nextElementSibling.querySelector('strong');
    if (title) title.classList.toggle('done', el.checked);
  } else if (el.dataset.obConsent) {
    ui.ob.consents[el.dataset.obConsent] = el.checked;
  } else if (el.dataset.consent && data.profile) {
    data.profile.consents = { ...(data.profile.consents || {}), [el.dataset.consent]: el.checked };
    if (el.dataset.consent === 'device') { if (el.checked) save(); else forgetStored(); }
    else save();
    renderMe();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (sheetKind) closeSheet();
    else if (ui.lunaView === 'full') closeLunaFull();
  }
});

/* =========================================================================
   Boot
   ========================================================================= */

renderStatic();
if (data.profile && validISO(data.profile.due)) {
  startLuna({ mode: data.profile.mode, sex: data.profile.sex, skin: String(data.profile.skin || 1), days: String(lunaDays()), kicks: String(kicksToday()) });
  renderAll();
  showTab('today');
  setLunaView('hero');
} else {
  data = blank();
  startLuna({ mode: 'moon', days: '150' });
  startOnboarding();
}
</script>
</body>
</html>
